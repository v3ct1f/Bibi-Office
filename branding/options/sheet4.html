<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#f4f4f6;font:16px 'Segoe UI',system-ui,sans-serif;color:#1e1b4b;width:1240px">
<div style="padding:28px 36px 0;font-size:26px;font-weight:700;letter-spacing:-.02em">Your Bibi circle, in Office colours</div>
<div style="padding:4px 36px 0;color:#555">Same glossy circle as the Bibi desktop icon, no pink, with an Office twist in each one.</div>
<div id="row" style="display:flex;gap:18px;padding:18px 36px 30px"></div>
<script>
let c=0;
const opts=[["M","Window orb","The glossy sphere in indigo, with an office window reflected in it.","M-window-orb"],["N","Sunrise orb","A gold sun rising over the desk: a new day at the office.","N-sunrise-orb"],["O","Planet and orbit","Your circle as a planet; the amber moon is a feature in orbit.","O-planet-orbit"],["P","Clock orb","Office hours: a glossy face at 10:10, which makes a smile.","P-clock-orb"]];
const row=document.getElementById("row");
(async()=>{for(const [k,n,d,f] of opts){
  const raw=await (await fetch(f+".svg")).text();
  const mk=(w)=>{c++;return raw.replace(/id="([\w-]+)"/g,'id="$1_'+c+'"').replace(/url\(#([\w-]+)\)/g,'url(#$1_'+c+')').replace("<svg ",'<svg width="'+w+'" height="'+w+'" ')};
  const el=document.createElement("div");
  el.style.cssText="background:#fff;border-radius:18px;padding:22px 18px;width:270px;box-shadow:0 1px 4px #0002;text-align:center";
  el.innerHTML=`<div style="font-weight:700;color:#6366f1;font-size:20px">${k}</div>
   <div style="width:170px;margin:10px auto">${mk(170)}</div>
   <div style="font-weight:700;margin-top:6px">${n}</div><div style="font-size:13px;color:#555;min-height:54px;margin-top:4px">${d}</div>
   <div style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:6px">${mk(32)}${mk(16)}</div>
   <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;background:#111827;border-radius:10px;padding:8px 12px">${mk(26)}<b style="color:#fff;font-size:18px;letter-spacing:-.01em">Bibi Office</b></div>
   <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px">${mk(26)}<b style="font-size:18px;letter-spacing:-.01em">Bibi Office</b></div>`;
  row.appendChild(el);}
 document.title="done";})();
</script>
