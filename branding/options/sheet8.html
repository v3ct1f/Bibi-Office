<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#f4f4f6;font:16px 'Segoe UI',system-ui,sans-serif;color:#1e1b4b;width:1100px">
<div style="padding:26px 30px 0;font-size:26px;font-weight:700;letter-spacing:-.02em">One icon per plan</div>
<div style="padding:4px 30px 0;color:#555">The browser tab, the menu and the sign-in follow the plan of the business you are in.</div>
<div id="row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 30px 30px"></div>
<script>
let c=0;
const opts=[
["Starter","€29 per month","Your glass bubble: the starting point.","icon-starter"],
["Business","€79 per month","Teal bubble with a halo ring: a step up.","icon-business"],
["Complete","€149 per month","Gold warmth inside the bubble: the top plan.","icon-complete"]];
const row=document.getElementById("row");
(async()=>{for(const [n,price,d,f] of opts){
  const raw=await (await fetch("../plans/"+f+".svg")).text();
  const mk=(w)=>{c++;return raw.replace(/id="([\w-]+)"/g,'id="$1_'+c+'"').replace(/url\(#([\w-]+)\)/g,'url(#$1_'+c+')').replace("<svg ",'<svg width="'+w+'" height="'+w+'" ')};
  const el=document.createElement("div");
  el.style.cssText="background:#fff;border-radius:18px;padding:20px 16px;box-shadow:0 1px 4px #0002;text-align:center";
  el.innerHTML=`<div style="font-weight:700;color:#6366f1;font-size:20px">${n}</div><div style="color:#777;font-size:13px">${price}</div>
   <div style="width:190px;margin:10px auto">${mk(190)}</div>
   <div style="font-size:13px;color:#555;min-height:36px">${d}</div>
   <div style="margin-top:10px;background:#dee1e6;border-radius:10px 10px 0 0;padding:8px 10px 0;text-align:left">
     <div style="display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px">${mk(16)}<span>Corner Bakery · Office</span></div>
   </div>
   <div style="display:flex;gap:7px;align-items:center;justify-content:center;margin-top:12px;background:#111827;border-radius:9px;padding:6px 8px">${mk(24)}<b style="color:#fff;font-size:16px;letter-spacing:-.01em">Bibi Office</b></div>`;
  row.appendChild(el);}
 document.title="done";})();
</script>
