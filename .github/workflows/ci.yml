name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: office_owner, POSTGRES_PASSWORD: office_owner, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U office_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://office_owner:office_owner@localhost:5432/postgres
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create app roles
        run: |
          PGPASSWORD=office_owner psql -h localhost -U office_owner -d postgres -c \
            "CREATE ROLE office_app LOGIN PASSWORD 'office_app' NOBYPASSRLS; CREATE ROLE office_relay LOGIN PASSWORD 'office_relay' BYPASSRLS;"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: E2E (web against real API + Postgres)
        run: |
          pnpm --filter @office/web exec playwright install --with-deps chromium
          pnpm --filter @office/web build:e2e
          pnpm --filter @office/web e2e
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
