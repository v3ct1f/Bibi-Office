# Dev only. Prod: Helm (infra/helm, later session).
name: office
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: office_owner
      POSTGRES_PASSWORD: office_owner
      POSTGRES_DB: office
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "office_owner"], interval: 5s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      OFFICE_ADMIN_CLIENT_SECRET: dev-only-admin-secret
    ports: ["8080:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: office, MINIO_ROOT_PASSWORD: office-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: office_owner
      POSTGRES_PWD: office_owner
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ["8233:8080"]

volumes: { pgdata: {}, natsdata: {}, miniodata: {} }
