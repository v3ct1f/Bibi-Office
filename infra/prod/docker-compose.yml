# Office on one server. Everything runs in Docker; Caddy (service "web") is the only thing facing the internet.
# Run from this folder with:  docker compose --env-file .env up -d --build     (see README.md)
name: office

x-build-api: &build-api
  context: ../..
  args: { APP: api }

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: office_owner          # owns the tables and runs migrations only; the app uses restricted roles
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: office
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_RELAY_PASSWORD: ${DB_RELAY_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office_owner -d office"]
      interval: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data

  # Runs once per release: creates/updates the database tables and installs the features. Then exits.
  migrate:
    build:
      context: ../..
      target: build          # the build stage has the full project and tools (not the slim runtime image)
      args: { APP: api }
    image: office-tools
    command: ["sh", "-c", "pnpm db:migrate && pnpm modules:install"]
    environment:
      DATABASE_URL: postgres://office_owner:${DB_OWNER_PASSWORD}@postgres:5432/office
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: *build-api
    image: office-api
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      DATABASE_URL_APP: postgres://office_app:${DB_APP_PASSWORD}@postgres:5432/office
      OIDC_ISSUER: https://${AUTH_HOST}/realms/office
      OIDC_AUDIENCE: office-api
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      SECRETS_KEY: ${SECRETS_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS}
      SELF_SIGNUP: "false"
      MAIL_SMTP_URL: ${MAIL_SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: office
      KEYCLOAK_ADMIN_CLIENT_ID: office-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${OFFICE_ADMIN_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_PRICE_LABEL: ${STRIPE_PRICE_LABEL}

  worker:
    build:
      context: ../..
      args: { APP: worker }
    image: office-worker
    command: ["dist/main.js"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL_APP: postgres://office_app:${DB_APP_PASSWORD}@postgres:5432/office
      DATABASE_URL_RELAY: postgres://office_relay:${DB_RELAY_PASSWORD}@postgres:5432/office
      SECRETS_KEY: ${SECRETS_KEY}
      NATS_URL: nats://nats:4222

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HOSTNAME_ADMIN: http://localhost:8080   # the admin console is only opened through an SSH tunnel
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # Office talks to it as http://keycloak:8080 inside the server
      KC_HTTP_ENABLED: "true"                   # HTTPS ends at Caddy
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      OFFICE_APP_URL: ${APP_URL}
      OFFICE_APP_URL_ALT: ${APP_URL_ALT}
      OFFICE_ADMIN_CLIENT_SECRET: ${OFFICE_ADMIN_CLIENT_SECRET}
      KC_SMTP_HOST: ${KC_SMTP_HOST}
      KC_SMTP_PORT: ${KC_SMTP_PORT}
      KC_SMTP_FROM: ${KC_SMTP_FROM}
      KC_SMTP_USER: ${KC_SMTP_USER}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  # The web app plus HTTPS and the reverse proxy for the API and sign-in. The only service with open ports.
  web:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile.web
      args:
        VITE_API_URL: https://${API_HOST}
        VITE_OIDC_ISSUER: https://${AUTH_HOST}/realms/office
        VITE_OIDC_CLIENT_ID: office-web
    image: office-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_HOST: ${WEB_HOST}
      API_HOST: ${API_HOST}
      AUTH_HOST: ${AUTH_HOST}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - keycloak

volumes:
  pgdata:
  natsdata:
  caddy_data:
  caddy_config:
